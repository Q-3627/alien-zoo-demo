<header><div><small>FIELD STATION 07 / 行星饲养研究站</small><h1>Alien Zoo <span style="font-weight:400">× AI 使用模式</span></h1></div><span class="pill">V0.5 · 研究者预览</span></header><main class="wrap" id="app"></main><footer>黄蕊研究 · 可行性试玩 / 非正式实验 · 数据仅存此浏览器，请及时导出</footer><div id="toast" role="status"></div><script>'use strict';
const VERSION='0.5.0', RULE='graded-conditional-v3', KEY='alien-zoo-v05', TARGET=55;
const names=['雾绒草','蓝铃叶','星冠蕨','珊瑚枝','月芽藤'],icons=['🌿','🪻','🌱','🪸','🍃'];
// Fixed before play. Inspired by original EXP2 data-generating structure, NOT the original fitted tree.
function outcome(x){return x[1]===6?-2:Math.floor(((x[1]+1)*[0,6,7,8,0,0,0][x[3]]+3)/6)-2;}
const histories=[[2,4,3,1,2],[2,1,3,4,2]].map((x,i)=>({id:'H'+(i+1),x,delta:outcome(x),source:'shared_history'}));
const questions=[{id:'amount',label:'多喂一点，会更好吗？',hint:'看看数量变化的线索'}, {id:'mix',label:'换个搭配，会怎样？',hint:'比较搭配不同的记录'}, {id:'repeat',label:'这份食谱以前试过吗？',hint:'查找相同或接近的食谱'}, {id:'unsure',label:'还没想好，帮我看看',hint:'从已有记录找一个比较方向'}];
const tests=[[2,2,3,2,2],[2,5,3,4,2],[2,6,3,1,2],[0,4,6,1,0]], testChoices=['增加','减少','不变'];
let s=null, x=[0,0,0,0,0], draft=null, ai=null, goal='', started=Date.now(), feedbackAt=0, error='';
const app=document.getElementById('app');
function esc(a){return String(a??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function event(type,data={}){const round=s.stage==='explore'?Math.min(10,s.rounds.length+1):s.stage==='feedback'?s.rounds.length:null;s.events.push({...data,type,at:new Date().toISOString(),stage:s.stage,round:data.round??round,elapsedMs:Date.now()-Date.parse(s.createdAt)});save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));}catch{toast('浏览器存储不可用，请及时导出本次记录');}}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',3500);}
function fmt(a){return a.map((v,i)=>`${names[i]} ${v}`).join(' · ');}
function delta(n){return (n>0?'+':'')+n;}
function recordTable(rows){return `<div class="scroll"><table><thead><tr><th>记录</th><th>五种植物片数（固定顺序）</th><th>族群变化</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.id||'R'+r.round)}</td><td>${r.x.join(' / ')}</td><td>${delta(r.delta)}</td></tr>`).join('')}</tbody></table></div>`;}
function home(){app.innerHTML=`<section class="card"><span class="tag">RESEARCHER PREVIEW · V0.5</span><h2 style="margin-top:12px">照顾 Shub，也为独立判断做准备。</h2><p>你将从 <b>20 只 Shub</b> 开始，获得 <b>10 次投喂机会</b>。每次选择五种植物各喂多少片，范围是 <b>0–6 片</b>。</p><div class="mission"><strong>本次任务：10 次投喂后，达到 55 只 Shub。</strong><p>你可以重复有效的食谱，也可以尝试新组合，看看能否找到更好的方法。</p><p>投喂结束后，助手和记录会收起。你将独立判断哪些植物影响结果，以及 4 份食谱会让族群增加、减少还是不变。当前数量和独立判断成绩会分开呈现。</p></div><p>两条历史记录供你起步；后续食谱与结果会自动记入笔记，每两次投喂共同回看一次。</p><div class="notice">AI 使用固定程序与有限分支交互，不连接实时 AI。结果使用明确标注的模拟规则，不是原论文训练模型。两个入口供研究者对比试玩，正式随机分组尚未实现。</div><div class="modes" style="margin-top:24px"><div class="mode"><span class="tag">MODE A · DELEGATION</span><h3>AI 依赖 / 代劳</h3><p>AI 先提供完整食谱。你可以查看记录、采用建议，或修改后再投喂。</p><button data-action="start" data-mode="delegation">试玩代劳模式 →</button></div><div class="mode"><span class="tag">MODE B · AUGMENTATION</span><h3>AI 增强 / 辅助</h3><p>你先配自己的食谱，再用问题卡片向 AI 提问。看过回应后，由你决定是否调整。</p><button data-action="start" data-mode="augmentation">试玩辅助模式 →</button></div></div><div class="actions">${localStorage.getItem(KEY)?'<button class="secondary" data-action="resume">恢复本版上次试玩</button>':''}</div><p class="muted">新一局会覆盖本版恢复记录。体验另一模式前，请先导出需要保留的数据。</p></section><section class="card"><h3>两组共享的 2 条历史喂养记录</h3><p class="muted">植物顺序：${names.join(' / ')}。历史记录不累加到你的初始族群。</p>${recordTable(histories)}<p>两份食谱带来了不同结果。你可以利用这些观察，决定下一次尝试。</p></section><section class="card"><details><summary>研究者：模拟规则与研究边界（含答案）</summary><p>参考 Kuhl 等人（2023）的 Alien Zoo Experiment 2。原版采用 DecisionTreeRegressor；本版未运行原训练模型。</p><p>本版预先固定：P2=6时为−2；其余情况下，Δ=round((P2+1)×w(P4)−2)，P4=0–6的权重依次为[0,1,7/6,4/3,0,0,0]。P1/P3/P5 不参与计算。初始20，10轮；任务目标55。始终重复历史最佳+3可得50，理论上界80。55是设计目标，非人口平均值。</p><p>代劳建议由已有记录的最佳食谱与固定比较顺序生成，不查询隐藏结果或保证最优；辅助回应仅使用已观察记录、初步食谱与所选问题。两组信息形式不同，成绩差异不能单独解释为认知决策权效应。点击采用、保持原样或修改均只作行为记录，不自动推断是否思考。</p><p>本版仍是研究者预览：无正式随机分组、后台采集或严格防回看。正式实验需隔离此入口。独立测试的选择题也不能穷尽学习或信息加工。</p><a href="https://github.com/ukuhl/IntroAlienZoo" target="_blank" rel="noopener">原作者代码（CC BY 4.0）</a> · <a href="https://doi.org/10.3389/fcomp.2023.1087929" target="_blank" rel="noopener">原论文</a></details></section>`;}
function mission(){return `<div class="mission" aria-label="任务目标与当前进度"><div class="row space"><strong>目标线 ${TARGET} 只</strong><span>当前 ${s.pack} 只 · 剩余 ${10-s.rounds.length} 次投喂</span></div><div class="target-track"><i style="width:${Math.max(0,Math.min(100,(s.pack-20)/(TARGET-20)*100))}%"></i></div><small>${s.pack>=TARGET?'已到目标线，仍可继续完成余下投喂。':`距目标线还差 ${TARGET-s.pack} 只。`} 结束后还有无 AI 的独立判断。</small></div>`;}
function recommend(){const rows=[...histories,...s.rounds],best=rows.reduce((a,b)=>b.delta>a.delta?b:a);const schedule=[[0,1],[2,1],null,[4,1],[3,1],null,[1,1],[0,-1],null,null];const step=schedule[s.rounds.length];const choice=[...best.x];if(step)choice[step[0]]=Math.max(0,Math.min(6,choice[step[0]]+step[1]));return {kind:'complete_plan',x:choice,sourceRecord:best.id||'R'+best.round,policyStep:step,shownAt:Date.now(),text:step?`以记录 ${best.id||'R'+best.round} 的食谱为参考（曾记录 ${delta(best.delta)}），这次建议把${names[step[0]]}改为 ${choice[step[0]]} 片，其余保持相同。下面是完整食谱，是否采用或修改由你决定；未试过的组合不保证更好。`:`建议使用当前记录中表现最好的一份食谱，记录 ${best.id||'R'+best.round} 的变化为 ${delta(best.delta)}。完整组合如下，你可以采用或修改。`};}
function start(mode){document.getElementById('toast').style.display='none';s={version:VERSION,rule:RULE,aiPolicy:'matched-evidence-scaffold-v3',target:TARGET,targetType:'fixed_task_target_not_population_mean',sessionId:crypto.randomUUID?.()||String(Date.now()),mode,preview:true,createdAt:new Date().toISOString(),stage:'explore',pack:20,rounds:[],events:[],sharedHistory:histories,tests:null};begin();event('session_start',{mode});render();}
function begin(){x=[0,0,0,0,0];draft=null;goal='';started=Date.now();error='';ai=s.mode==='delegation'?recommend():null;pending();if(ai)event('ai_suggestion_shown',{ai});}
function pending(){s.pending={x:[...x],draft,ai,goal,started};save();}
function plants(){return `<div class="plants">${names.map((n,i)=>`<div class="plant"><label for="p${i}">${n}</label><span class="icon" aria-hidden="true">${icons[i]}</span><input id="p${i}" type="number" min="0" max="6" step="1" value="${x[i]}" aria-label="${n}片数"><div class="muted">0–6 片</div></div>`).join('')}</div>`;}
function render(){if(!s)return home();if(s.stage==='feedback')return feedback();if(s.stage==='test')return renderTest();if(s.stage==='done')return done();const aiPanel=ai?`<div class="ai" id="ai"><strong>AI 研究助手 · ${ai.kind==='complete_plan'?'完整食谱建议':'回应你的问题'}</strong>${ai.kind==='observation_scaffold'?`<span class="pill">${esc(questions.find(q=>q.id===goal)?.label)}</span>`:''}${ai.sections?ai.sections.map(section=>`<section class="evidence-section"><h4>${section.title}</h4><p>${esc(section.text)}</p></section>`).join(''):`<p>${esc(ai.text)}</p>`}${ai.x?`<p>${fmt(ai.x)}</p><button class="secondary" data-action="adopt">将建议填入食谱</button>`:`<p class="muted">回应依据：${ai.requestDraft.join(' / ')}（植物顺序同食谱）。</p><div id="ai-status" class="ai-status"></div>`}</div>`:'';app.innerHTML=`<div class="row space"><span class="tag">${s.mode==='delegation'?'代劳 / DELEGATION':'辅助 / AUGMENTATION'} · 投喂 ${s.rounds.length+1} / 10</span><button class="secondary" data-action="exit">研究者入口</button></div><div class="progress"><i style="width:${s.rounds.length*10}%"></i></div>${mission()}<div class="grid"><section class="card"><div class="row space"><div><span class="tag">SHUB COLONY</span><div class="big">${s.pack} <span style="font-size:14px">只 Shub</span></div></div><span class="pill">第 ${Math.floor(s.rounds.length/2)+1} 个探索区间</span></div><div class="zoo" aria-label="Shub 族群示意，实际数量以文字为准">${Array.from({length:Math.min(12,Math.max(0,s.pack))},()=>'<span class="shub">•ᴗ•</span>').join('')}</div>${s.mode==='delegation'?aiPanel:''}<h3>${s.mode==='augmentation'?'先配一份你想尝试的食谱':'准备本轮喂养组合'}</h3>${plants()}${s.mode==='augmentation'?`<section class="assistant-zone" aria-label="AI互动区"><h3>食谱配好了。这次想让助手帮你看看什么？</h3><p class="muted">点击一张卡片，按当前食谱提问。没有标准选法；还没想好也可以请助手帮忙。</p><div class="question-cards">${questions.map(q=>`<button class="question-card ${goal===q.id?'selected':''}" data-action="ask" data-goal="${q.id}" aria-pressed="${goal===q.id}"><strong>${q.label}</strong><span>${q.hint}</span></button>`).join('')}</div>${aiPanel||'<p class="muted">助手会在你提交食谱后回应，不会替你配出完整组合。</p>'}</section>`:''}<p class="error" role="alert">${esc(error)}</p><div class="actions"><button data-action="feed" ${!ai?'disabled':''}>确认投喂 →</button><button class="secondary" data-action="export">导出记录</button></div><p class="muted">${!ai?'先配食谱并点击一张问题卡片，再决定如何投喂。':'查看回应后，可以直接投喂，也可以先修改食谱。'} 准备好后，确认本轮食谱。</p></section><aside><section class="card"><span class="tag">FIELD NOTEBOOK</span><h2 style="margin-top:10px">Shub 饲养研究记录</h2><p class="muted">五列顺序：${names.join(' / ')}。这里保留食谱和实际结果，供你自己比较。</p>${recordTable([...histories,...s.rounds])}</section><section class="card"><h3>照顾族群，也为独立判断做准备</h3><p>你可以尝试新的食谱，也可以重复之前的食谱。达到目标后，仍请完成 10 次投喂；结束时需要离开助手，自己判断新的组合。</p><span class="pill">固定模拟规则</span><span class="pill">非实时 AI</span></section></aside></div>`;updateAiStatus();}
function valid(){return x.every(v=>Number.isInteger(v)&&v>=0&&v<=6);}

function rowId(r){return r.id||'R'+r.round;}
function changed(a,b){return a.map((v,i)=>v!==b[i]?i:-1).filter(i=>i>=0);}
function observedGroups(rows){const groups=new Map();for(let k=0;k<5;k++)for(const r of rows){const background=r.x.filter((_,i)=>i!==k).join('/');const key=k+':'+background;if(!groups.has(key))groups.set(key,{plant:k,background,rows:[]});groups.get(key).rows.push(r);}return [...groups.values()].filter(g=>new Set(g.rows.map(r=>r.x[g.plant])).size>=2);}
function evidenceCoverage(rows){const groups=observedGroups(rows);return names.map((name,k)=>{const matches=groups.filter(g=>g.plant===k);const differs=matches.some(g=>new Set(g.rows.map(r=>r.delta)).size>1);return {plant:k+1,name,status:differs?'observed_difference':matches.length?'only_equal_comparisons':'no_controlled_comparison',groups:matches.map(g=>({recordIds:g.rows.map(rowId),quantities:[...new Set(g.rows.map(r=>r.x[k]))].sort((a,b)=>a-b),outcomes:[...new Set(g.rows.map(r=>r.delta))]}))};});}
function buildScaffold(rows,recipe,question){
 const distance=r=>r.x.reduce((n,v,i)=>n+Math.abs(v-recipe[i]),0);
 const nearest=rows.reduce((a,b)=>distance(b)<distance(a)?b:a);
 const differences=changed(recipe,nearest.x),exact=rows.filter(r=>changed(recipe,r.x).length===0);
 const groups=observedGroups(rows),coverage=evidenceCoverage(rows);
 let focus=differences.length===1?differences[0]:null;
 const last=rows.at(-1),lastDiff=changed(recipe,last.x);
 if(focus===null&&lastDiff.length===1&&question!=='repeat')focus=lastDiff[0];
 let candidateGroups=groups;
 if(focus!==null)candidateGroups=groups.filter(g=>g.plant===focus);
 const similarity=g=>g.rows[0].x.filter((_,i)=>i!==g.plant).reduce((n,v,i)=>n+Math.abs(v-recipe.filter((_,j)=>j!==g.plant)[i]),0);
 candidateGroups.sort((a,b)=>similarity(a)-similarity(b)||
   (new Set(b.rows.map(r=>r.delta)).size>1?1:0)-(new Set(a.rows.map(r=>r.delta)).size>1?1:0)||b.rows.length-a.rows.length);
 let group=candidateGroups[0]||null;
 let evidence=[rowId(nearest)],facts='',interpretation='',next='';
 const controlled=rows.flatMap((a,i)=>rows.slice(i+1).map(b=>({a,b,axes:changed(a.x,b.x)}))).filter(p=>p.a.delta!==p.b.delta);
 const confounded=controlled.filter(p=>p.axes.length>1).sort((a,b)=>a.axes.length-b.axes.length);
 const missing=coverage.filter(c=>c.status!=='observed_difference');
 const openPair=confounded.find(p=>p.axes.some(k=>missing.some(c=>c.plant===k+1)));
 if(question==='repeat'&&exact.length){
   facts=`这份食谱已出现 ${exact.length} 次（${exact.map(rowId).join('、')}），记录的变化为 ${[...new Set(exact.map(r=>delta(r.delta)))].join('、')}。`;
   interpretation=`重复记录支持这份具体食谱的结果${new Set(exact.map(r=>r.delta)).size===1?'一致':'存在差异'}，但不会自动说明其他数量或搭配的结果。`;
   next='如果继续重复，你是在检查已知食谱；如果想了解作用范围，需要增加不同数量或搭配的观察。两种做法都可以，由你选择。';
   evidence=exact.map(rowId);
 }else if(group){
   const k=group.plant;if(focus===null)focus=k;
   const points=[...new Map(group.rows.map(r=>[r.x[k],r])).values()].sort((a,b)=>a.x[k]-b.x[k]);
   const scoped=similarity(group)===0;
   facts=`${group.rows.map(rowId).join('、')} 的其他四种植物数量相同；${names[k]}为 ${points.map(r=>r.x[k]).join('、')} 片时，变化分别为 ${points.map(r=>delta(r.delta)).join('、')}。`;
   evidence=group.rows.map(rowId);
   const same=new Set(points.map(r=>r.delta)).size===1;
   if(same){const other=groups.find(g=>g.plant===k&&new Set(g.rows.map(r=>r.delta)).size>1);interpretation=other?`这组已试数量的结果相同；但 ${other.rows.map(rowId).join('、')} 已在另一组搭配中显示${names[k]}数量变化伴随结果差异。不能把本组的相同结果推广成这株植物完全无关。`:`在这组已试数量和搭配中，${names[k]}的变化没有表现出结果差异。这还不能区分「它没有作用」与「这几个数量恰好表现相同」，不能直接判定这株植物完全无关。`;if(other)evidence.push(...other.rows.map(rowId));}
   else{const moves=points.slice(1).map((r,i)=>Math.sign(r.delta-points[i].delta));const up=moves.includes(1),down=moves.includes(-1);const highest=Math.max(...points.map(r=>r.delta));interpretation=`这些记录支持：在这份搭配和已试数量内，${names[k]}的数量与结果有关。${up&&down?'数量增加时既出现过改善也出现过下降，因此这里并不是越多越好。':up?'已试数量中出现了加量后结果改善，但未试过的数量仍不能直接外推。':'已试数量中出现了加量后结果下降，不能将这个结论推广到所有搭配。'} 这组已试记录中，${points.filter(r=>r.delta===highest).map(r=>r.x[k]).join('、')}片表现最高（${delta(highest)}）。`;}
   const lo=points[0].x[k],hi=points.at(-1).x[k],adj=[lo-1,hi+1].filter(v=>v>=0&&v<=6);
   next=same?`若想区分这两种解释，可考虑已试范围之外${adj.length?`的相邻数量（${adj.join('或')}片）`: '的其他搭配'}，同时保留其他植物的数量。新结果可能相同，也可能不同；是否继续检验由你决定。`:'目前还不确定这段数量关系换个搭配后是否保持。你可以继续了解数量，也可以选择一种搭配变化，看看观察是否仍成立。';
   if(!scoped){facts+=' 这组记录的搭配与提问时食谱并不完全相同。';interpretation+=' 它不是对当前食谱结果的预测。';}
 }else{
   facts=exact.length?`这份食谱与 ${exact.map(rowId).join('、')} 相同，记录变化为 ${delta(exact[0].delta)}。`:`最接近的是 ${rowId(nearest)}（${delta(nearest.delta)}）；提问时改变了${differences.map(k=>`${names[k]} ${nearest.x[k]}→${recipe[k]}`).join('、')}。`;
   if(focus!==null){interpretation=`关于${names[focus]}，目前还没有仅改变它的数量、其他植物相同的成对记录。此次${differences.length===1?'与参考食谱只差这一项，可以形成一个直接比较':'改动需要与参考记录一起检查'}，结果要等投喂后才能知道。`;next=`你可以保持其他植物不变，继续了解${names[focus]}，或选择其他方向。目前没有足够观察给出它的数量规律。`;}
   else{interpretation=exact.length?'目前只有这份具体食谱的重复观察，尚不足以判断其中各植物的独立作用。':'目前这些差异还不能归因于某一种植物。几种植物一起变化时，多种解释都可能符合记录。';next='可以选一条已有食谱作为参考，先只改变你想了解的一种植物；也可以保留自己的方案，观察后再比较。';}
 }
 if(question==='mix'&&group){next='这组比较固定了其他植物，尚不能说明换搭配后是否一样。你可以保留正在了解的植物数量，只改变另一种植物，再与这组观察比较；由你选择比较对象。';}
 if((question==='unsure'||exact.length&&differences.length===0)&&openPair){const axes=openPair.axes.map(k=>names[k]).join('、');next+=` 另一个未排除的问题是：${rowId(openPair.a)} 与 ${rowId(openPair.b)} 的结果不同，但同时改变了${axes}；这组记录还不能区分各项作用或搭配影响。`;evidence.push(rowId(openPair.a),rowId(openPair.b));}
 return {kind:'observation_scaffold',sections:[{title:'已经观察到',text:facts},{title:'目前可以怎么理解',text:interpretation},{title:'还缺少哪种比较',text:next}],text:[facts,interpretation,next].join(' '),evidence:[...new Set(evidence)],focusPlant:focus===null?null:focus+1,coverage,goal:question,requestDraft:[...recipe],shownAt:Date.now()};
}
function aiStale(){return !!(s?.mode==='augmentation'&&ai?.requestDraft&&changed(x,ai.requestDraft).length);}
function updateAiStatus(){const stale=aiStale();const el=document.getElementById('ai-status');if(el){el.innerHTML=stale?'<strong>食谱已修改。</strong> 上方回应针对修改前的组合。<button class="secondary" data-action="refresh-ai">按现在的食谱重新分析</button>':'回应对应当前食谱。';el.className=stale?'ai-status stale':'ai-status';}const button=app.querySelector('[data-action=feed]');if(button&&ai)button.textContent=stale?'按修改后的食谱投喂 →':'确认投喂 →';}

function scaffold(){return buildScaffold([...histories,...s.rounds],x,goal);}
function feed(){if(!valid()){error='每种植物必须是 0–6 的整数，请检查食谱。';return render();}if(!ai){error='先点击一张问题卡片，让助手回应你的初步食谱。';return render();}error='';const d=outcome(x),before=s.pack;const r={round:s.rounds.length+1,x:[...x],delta:d,before,after:before+d,goal:goal||null,initialDraft:draft,ai:JSON.parse(JSON.stringify(ai)),modifiedSuggestion:ai.x?!x.every((v,i)=>v===ai.x[i]):null,modifiedDraft:draft?!x.every((v,i)=>v===draft[i]):null,decisionMs:Date.now()-started,afterLatestAiMs:Date.now()-ai.shownAt,aiStaleAtSubmission:aiStale(),evidenceExposure:evidenceCoverage([...histories,...s.rounds]),target:TARGET,submittedAt:new Date().toISOString()};s.rounds.push(r);s.pack+=d;r.evidenceExposureAfter=evidenceCoverage([...histories,...s.rounds]);event('feeding_submitted',r);if(s.rounds.length%2===0){s.stage='feedback';s.feedbackAt=Date.now();save();feedback();}else{toast(`第 ${r.round} 次投喂：${before} → ${s.pack}（${delta(d)}）`);begin();render();}}
function feedback(){app.innerHTML=`${mission()}<section class="card"><span class="tag">OBSERVATION REVIEW · ${s.rounds.length/2} / 5</span><h2 style="margin-top:12px">两次投喂，回看一下</h2>${recordTable(s.rounds.slice(-2))}<p>比较这两份食谱和结果，再决定接下来怎么喂。你可以重复，也可以尝试新的组合。</p><p class="muted">食谱与结果已经记入饲养研究记录。</p><button data-action="next">${s.rounds.length===10?'完成投喂，进入无 AI 判断 →':'继续投喂 →'}</button><button class="secondary" data-action="export" style="margin-left:8px">导出记录</button></section>`;}
function renderTest(){
 const phase=s.tests.phase,labels={prediction:'1 / 3 · 食谱预测',relevance:'2 / 3 · 植物判断',rule:'3 / 3 · 规则判断'};
 let content='';
 if(phase==='prediction')content=`<h3>先独立预测下面四份食谱</h3><p>每题从20只开始。植物顺序：${names.join(' / ')}。提交后进入下一部分，本页答案会锁定。</p>${tests.map((t,i)=>`<div class="test"><label for="t${i}">组合 ${i+1}：<b>${t.join(' / ')}</b>，喂养后族群会</label> <select required id="t${i}" name="t${i}"><option value="">请选择</option>${[...testChoices,'不确定'].map(c=>`<option>${c}</option>`).join('')}</select></div>`).join('')}`;
 else if(phase==='relevance')content=`<h3>哪些植物会影响喂养结果？</h3><p>每种均作答。若当前观察不足，可以选择「不确定」。提交后答案会锁定。</p>${names.map((name,i)=>`<div class="test row"><label for="rel${i}" style="min-width:100px">${name}</label><select required id="rel${i}" name="rel${i}"><option value="">请选择</option><option>影响</option><option>不影响</option><option>不确定</option></select></div>`).join('')}`;
 else content='<h3>哪个判断最符合你学到的规则？</h3><div class="test"><select required name="rule" aria-label="规则判断"><option value="">请选择</option><option value="conditional">蓝铃叶数量的效果会随珊瑚枝数量变化，蓝铃叶过量也可能降低结果</option><option value="monotonic">所有植物越多越好</option><option value="single">只有蓝铃叶影响结果，其他植物都无关</option><option value="total">只取决于五种植物的总量</option><option value="unknown">仍不确定</option></select></div>';
 app.innerHTML=`<section class="card"><span class="tag">INDEPENDENT TEST · ${labels[phase]}</span><h2 style="margin-top:12px">离开助手，你怎样判断？</h2><p>AI、历史记录与研究笔记已撤去。所有部分完成前，不提供正确答案或分数。</p><form id="testForm">${content}<button type="submit">${phase==='rule'?'完成独立判断':'提交并继续 →'}</button></form></section>`;
 for(const el of app.querySelectorAll('select'))el.value=s.tests.draftAnswers[el.name]||'';
 const form=document.getElementById('testForm');form.addEventListener('change',e=>{s.tests.draftAnswers[e.target.name]=e.target.value;save();});
 form.addEventListener('submit',e=>{e.preventDefault();const answers=Object.fromEntries(new FormData(form));Object.assign(s.tests.answers,answers);s.tests.phaseTimes[phase]=Date.now()-s.tests.phaseStarted;s.tests.draftAnswers={};event('independent_phase_locked',{phase,answers,phaseDurationMs:s.tests.phaseTimes[phase]});if(phase==='rule'){s.tests.phase='complete';s.tests.elapsedMs=Date.now()-s.testStarted;s.tests.submittedAt=new Date().toISOString();s.stage='done';s.tests.scores=testScores();event('test_submitted',{answers:s.tests.answers,testDurationMs:s.tests.elapsedMs,scores:s.tests.scores});}else{s.tests.phase=phase==='prediction'?'relevance':'rule';s.tests.phaseStarted=Date.now();}save();render();});
}
function testScores(){const answers=s.tests.answers;const correct=tests.map((t,i)=>answers['t'+i]===(outcome(t)>0?'增加':outcome(t)<0?'减少':'不变'));return {relevance:names.filter((_,i)=>answers['rel'+i]===([1,3].includes(i)?'影响':'不影响')).length,rule:answers.rule==='conditional'?1:0,prediction:correct.filter(Boolean).length,unseenPredictionCorrect:correct.filter((v,i)=>v&&!s.tests.previouslySeen[i]).length,unseenPredictionTotal:s.tests.previouslySeen.filter(v=>!v).length,answerKey:tests.map(t=>outcome(t)>0?'增加':outcome(t)<0?'减少':'不变')};}
function done(){const score=s.tests.scores||testScores();app.innerHTML=`<section class="card"><span class="tag">SESSION COMPLETE</span><h2 style="margin-top:12px">本次饲养研究已完成</h2><p>完成10次投喂，最终 <b>${s.pack} 只 Shub</b>。${s.pack>=TARGET?'达到':'本次未达到'}55只任务目标。</p><p>族群数量与独立判断分开呈现：</p><div class="row"><span class="pill">植物判断：${score.relevance} / 5</span><span class="pill">规则选择：${score.rule} / 1</span><span class="pill">食谱预测：${score.prediction} / 4</span><span class="pill">其中未在投喂记录出现的食谱：${score.unseenPredictionCorrect} / ${score.unseenPredictionTotal}</span></div><p class="muted">这些是本模拟任务的描述性结果，不代表已验证的心理量表。正确选择一条规则，不等于一定能在新食谱中应用。记录中保留你实际见过的比较，供后续区分证据机会和作答表现。</p><div class="actions"><button data-action="export">下载完整 JSON 记录</button><button class="secondary" data-action="csv">下载逐轮 CSV</button><button class="secondary" data-action="exit">回到入口，体验另一模式</button></div><details><summary>查看本版规则与答案</summary><p>P2=6时为−2；否则 Δ=round((P2+1)×w(P4)−2)，P4=0–6的权重为[0,1,7/6,4/3,0,0,0]。P1/P3/P5不参与结果。这是新设定的确定性模拟，不是原论文训练模型。食谱预测答案：${score.answerKey.join('、')}。</p></details></section>`;}
function download(content,type,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF',content],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000);showExport(content);}
function showExport(content){document.getElementById('exportDialog')?.remove();const dialog=document.createElement('dialog');dialog.id='exportDialog';dialog.style.cssText='width:min(90vw,720px);border:1px solid #c9d7c3;border-radius:14px;padding:22px';const title=document.createElement('h3');title.textContent='导出数据 · 下载或复制';const info=document.createElement('p');info.textContent='已发起文件下载。若浏览器未保存，可复制下方完整数据。';const area=document.createElement('textarea');area.value=content;area.readOnly=true;area.setAttribute('aria-label','完整导出数据');area.style.cssText='width:100%;height:300px;display:block;margin-bottom:16px';const select=document.createElement('button');select.textContent='全选数据';select.onclick=()=>{area.focus();area.select();};const close=document.createElement('button');close.className='secondary';close.style.marginLeft='10px';close.textContent='关闭';close.onclick=()=>dialog.close();dialog.append(title,info,area,select,close);document.body.append(dialog);dialog.showModal();}
function exportData(csv=false){if(!s)return;event('data_export',{format:csv?'csv':'json'});if(csv){const head=['sessionId','mode','round','P1','P2','P3','P4','P5','delta','before','after','goal','decisionMs','afterLatestAiMs','initialDraft','ai','modifiedSuggestion','modifiedDraft','aiStaleAtSubmission','submittedAt'];const rows=s.rounds.map(r=>[s.sessionId,s.mode,r.round,...r.x,r.delta,r.before,r.after,r.goal,r.decisionMs,r.afterLatestAiMs,JSON.stringify(r.initialDraft),JSON.stringify(r.ai),r.modifiedSuggestion,r.modifiedDraft,r.aiStaleAtSubmission,r.submittedAt]);download([head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv',`AlienZoo-${s.mode}-${s.sessionId}.csv`);}else download(JSON.stringify(s,null,2),'application/json',`AlienZoo-${s.mode}-${s.sessionId}.json`);}
app.addEventListener('input',e=>{if(e.target.id.match(/^p[0-4]$/)){let i=+e.target.id[1],v=e.target.value===''?NaN:Number(e.target.value);x[i]=v;error='';const alert=app.querySelector('[role=alert]');if(alert)alert.textContent='';updateAiStatus();event('plant_edit',{plant:i+1,value:Number.isNaN(v)?null:v});pending();}});
/* removed per-round self-report: behavior is logged without interpreting cognition */
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'start':start(b.dataset.mode);break;case'exit':if(s)event('preview_exit');s=null;home();break;case'resume':try{s=JSON.parse(localStorage.getItem(KEY));if(s.version!==VERSION)throw Error();({x,draft,ai,goal,started}=s.pending);event('session_resumed');render();}catch{s=null;toast('无法恢复此记录');home();}break;case'adopt':{const previous=[...x];x=[...ai.x];error='';event('suggestion_adopted',{previous,x});pending();render();break;}case'refresh-ai':case'ask':if(!valid()){error='每种植物必须是 0–6 的整数，请检查食谱后再提问。';render();break;}error='';goal=b.dataset.goal||goal||'unsure';if(!draft)draft=[...x];ai=scaffold();event('scaffold_requested',{draft:[...x],initialDraft:draft,goal,ai});pending();render();break;case'feed':feed();break;case'next':event('feedback_view_finished',{round:s.rounds.length,viewMs:Date.now()-s.feedbackAt});if(s.rounds.length===10){s.stage='test';s.testStarted=Date.now();s.tests={phase:'prediction',answers:{},draftAnswers:{},items:tests,previouslySeen:tests.map(t=>[...histories,...s.rounds].some(r=>changed(t,r.x).length===0)),phaseStarted:Date.now(),phaseTimes:{},coverage:evidenceCoverage([...histories,...s.rounds])};event('ai_withdrawn');render();}else{s.stage='explore';begin();render();}save();break;case'export':exportData();break;case'csv':exportData(true);break;}});
home();
</script></html>
